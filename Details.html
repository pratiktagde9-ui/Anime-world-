<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Details</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}
img{
  width:250px;
  border-radius:12px;
}
.container{
  max-width:700px;
  margin:auto;
}
</style>

</head>
<body>

<div class="container" id="anime">
Loading...
</div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

const query = `
query {
  Media(id:${id}, type:ANIME){
    title{
      romaji
    }
    description(asHtml:false)
    episodes
    averageScore
    coverImage{
      large
    }
  }
}
`;

fetch("https://graphql.anilist.co",{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body:JSON.stringify({query})
})
.then(res=>res.json())
.then(data=>{
  const anime=data.data.Media;

  document.getElementById("anime").innerHTML=`
    <h1>${anime.title.romaji}</h1>
    <img src="${anime.coverImage.large}">
    <h3>Episodes: ${anime.episodes ?? "?"}</h3>
    <h3>⭐ ${anime.averageScore ?? "N/A"}</h3>
    <p>${anime.description}</p>
  `;
});
</script>

</body>
  </html>
