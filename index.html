<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime World - Watch Anime & Cartoons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f17;
            color: #ffffff;
            padding-bottom: 50px;
        }

        /* Header / Navbar */
        header {
            background-color: #1a1a26;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #ff4757;
            font-size: 24px;
        }

        /* Container Section */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-left: 4px solid #ff4757;
            padding-left: 10px;
        }

        /* Grid Cards Layout */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1a1a26;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card-info {
            padding: 12px;
            text-align: center;
        }

        .card-info h3 {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            font-size: 12px;
            color: #a4b0be;
            margin-top: 5px;
        }

        .watch-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 14px;
            background-color: #ff4757;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        /* Video Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a26;
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            margin-top: 15px;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Anime World 🎬</h1>
    </header>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Anime Section -->
        <h2 class="section-title">Trending Anime</h2>
        <div class="card-grid">
            
            <!-- Item 1 -->
            <div class="card" onclick="openPlayer('Naruto Episode 1', 'https://www.youtube.com/embed/tbnzAVRZ9Xc')">
                <img src="https://m.media-amazon.com/images/M/MVBmM2MyZWM5MDgtMTBmMS00MmI2LWIzMDUtYTBhNDhhM2I0OTcwXkEyXkFqcGc@._V1_.jpg" alt="Naruto">
                <div class="card-info">
                    <h3>Naruto</h3>
                    <p>Anime • Ep 1</p>
                    <span class="watch-btn">Watch Now</span>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="card" onclick="openPlayer('Dragon Ball Super', 'https://www.youtube.com/embed/tbnzAVRZ9Xc')">
                <img src="https://m.media-amazon.com/images/M/MVBmMjA2MDRhY2UtN2JmNS00MmI1LTgxNTgtMWI4M2I1MWI1YWEzXkEyXkFqcGc@._V1_.jpg" alt="Dragon Ball">
                <div class="card-info">
                    <h3>Dragon Ball Super</h3>
                    <p>Anime • Ep 1</p>
                    <span class="watch-btn">Watch Now</span>
                </div>
            </div>

        </div>

        <br><br>

        <!-- Cartoons Section -->
        <h2 class="section-title">Popular Cartoons</h2>
        <div class="card-grid">
            
            <!-- Item 3 -->
            <div class="card" onclick="openPlayer('Ben 10 Classic', 'https://www.youtube.com/embed/tbnzAVRZ9Xc')">
                <img src="https://m.media-amazon.com/images/M/MVBmYzA4ZDliYTItNDdhNS00YzE4LTgwN2UtNmVhZjIxMjkyM2RmXkEyXkFqcGc@._V1_.jpg" alt="Ben 10">
                <div class="card-info">
                    <h3>Ben 10</h3>
                    <p>Cartoon • Ep 1</p>
                    <span class="watch-btn">Watch Now</span>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="card" onclick="openPlayer('Doraemon Movie', 'https://www.youtube.com/embed/tbnzAVRZ9Xc')">
                <img src="https://m.media-amazon.com/images/M/MVBmYzY1YzQ0MTItZjJhNS00MTdhLTg4YTAtN2I3Y2JmMWY3YmM5XkEyXkFqcGc@._V1_.jpg" alt="Doraemon">
                <div class="card-info">
                    <h3>Doraemon</h3>
                    <p>Cartoon • Movie</p>
                    <span class="watch-btn">Watch Now</span>
                </div>
            </div>

        </div>

    </div>

    <!-- Video Modal (Popup Player) -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h3 id="videoTitle">Watching Video</h3>
            <div class="video-box">
                <iframe id="videoIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript to Handle Video Playback -->
    <script>
        function openPlayer(title, embedUrl) {
            document.getElementById('videoTitle').innerText = title;
            document.getElementById('videoIframe').src = embedUrl;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = ''; // Stop video on close
        }
    </script>

</body>
  </html>
